spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "postService.event"
        spring.json.type.mapping: "com.CodingBrajmohan.postService.event.PostCreated:postService.event.PostCreated,com.CodingBrajmohan.postService.event.PostLiked:postService.event.PostLiked"